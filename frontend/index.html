<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8ff" />
    <meta name="description" content="Bạn đồng hành: trò chuyện, nhận diện cảm xúc và gợi ý bài hát hợp tâm trạng." />
    <title>Bạn đồng hành</title>
    <script>
      // Đặt theme trước khi vẽ trang để không bị nháy sáng/tối (khớp theme-provider.tsx).
      ;(function () {
        var t = "system"
        try {
          t = localStorage.getItem("theme") || "system"
        } catch (e) {}
        var dark =
          t === "dark" ||
          (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        var r = document.documentElement
        r.classList.add(dark ? "dark" : "light")
        r.style.colorScheme = dark ? "dark" : "light"
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#14121c" : "#faf8ff")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
